schema:
  public:
    category:
      type: categorical
      enum_values: [pothole, water_supply, garbage, streetlight, drainage, stray_animals]
    spoken_location:
      type: text
      description: >
        Where the caller says the problem is, in their own words, exactly as
        they said it. Writing this runs the location search.
      llm_settable: true
    cleaned_query:
      type: text
      description: >
        The same place tidied into something a map could find — mishearings
        fixed, abbreviations expanded, filler dropped. Empty when they have not
        named somewhere a map could hold, such as "outside our lane".
      llm_settable: true
    description:
      type: text
      description: The citizen's description of the problem in their own words.
      llm_settable: true
    duplicate_found:
      type: bool
    existing_complaint_id:
      type: text
    duplicate_decision:
      type: categorical
      description: Whether to attach to the existing complaint or file a new one.
      enum_values: [attach, new]
      llm_settable: true
    override_reason:
      type: text
      description: Why the citizen says their report is not the same problem.
      llm_settable: true
    contact_confirmed:
      type: bool
      description: Whether the callback number has been read back and confirmed.
      llm_settable: true
    details_verified:
      type: bool
      description: Whether the summary was read back and confirmed. Gates submit.
      llm_settable: true
