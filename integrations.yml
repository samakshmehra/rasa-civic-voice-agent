# External integrations for the Civico voice civic agent.

llm:
  provider: openai
  # gpt-5-mini rather than the full model: this skill leaves the model very
  # little room to be clever. tool_constraints, complete_when and
  # assess_location already decide what may happen next, so raw model strength
  # buys less here than it would in a loosely-specified agent — at ~3.5x the
  # cost. If quality holds, that is itself worth reporting back to Rasa.
  # No temperature: the GPT-5 family rejects a non-default value.
  model: gpt-5.4-mini
  api_key_env: OPENAI_API_KEY

channels:
  rest:
    enabled: true
  inspector:
    enabled: true
    # Deepgram end-to-end: speech-to-text (ASR) and text-to-speech (TTS)
    asr:
      name: deepgram
      language_map:
        en:
          model: flux-general-en
      # 5000ms left a long dead pause before every reply. 1800 feels
      # conversational; raise it if digit strings get cut mid-sequence.
      eot_threshold: 0.7
      eot_timeout_ms: 1800
    tts:
      name: deepgram
      language_map:
        en:
          model: aura-2-andromeda-en
