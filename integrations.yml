# External integrations for the Civico voice civic agent.

# The orchestrator LLM is a model-group reference. Provider, model and
# credentials live on the named group — the inline form was removed in
# rasa-pro 3.20.0.dev6.
#
# gpt-5.4-mini rather than a larger model: this project leaves the model very
# little room to be clever. tool_constraints, complete_when and the location
# tool already decide what may happen next, so raw model strength buys less
# here than it would in a loosely-specified agent, at several times the cost.
llm:
  model_group: orchestrator

model_groups:
  - id: orchestrator
    models:
      - provider: openai
        model: gpt-5.4-mini
        api_key_env: OPENAI_API_KEY

channels:
  rest:
    enabled: true
  inspector:
    enabled: true
    # Deepgram end-to-end: speech-to-text (ASR) and text-to-speech (TTS)
    asr:
      name: deepgram
      language_map:
        en:
          model: flux-general-en
      # 5000ms left a long dead pause before every reply. 1800 feels
      # conversational; raise it if digit strings get cut mid-sequence.
      eot_threshold: 0.7
      eot_timeout_ms: 1800
    tts:
      name: deepgram
      language_map:
        en:
          model: aura-2-andromeda-en
